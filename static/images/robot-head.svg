<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Antenna ball -->
  <circle cx="55" cy="8.4" r="6.6" fill="red" class="antenna-light"/>

  <!-- Antenna stem -->
  <line x1="55" y1="15" x2="55" y2="38"/>

  <!-- Head -->
  <rect x="15" y="38" width="80" height="60" rx="6"/>

  <!-- Left ear -->
  <rect x="5" y="48" width="10" height="16" rx="3" fill="yellow" class="antenna-light"/>

  <!-- Right ear -->
  <rect x="95" y="48" width="10" height="16" rx="3" fill="yellow" class="antenna-light"/>

  <!-- Left eye -->
  <circle cx="38" cy="58" r="7.125" fill="#00ff00"/>

  <!-- Right eye -->
  <circle cx="72" cy="58" r="7.125" fill="#00ff00"/>

  <!-- Mouth -->
  <rect x="37" y="78" width="36" height="8" rx="2"/>
</svg>