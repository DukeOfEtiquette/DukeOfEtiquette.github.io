baseURL = 'https://DukeOfEtiquette.github.io/'
title = 'DukeOfEtiquette'
languageCode = 'en-us'
defaultContentLanguage = 'en'
enableEmoji = true
enableRobotsTXT = true

[taxonomies]
  tag = 'tags'

[params]
  sitename = 'DukeOfEtiquette'
  defaultColor = 'dark'
  dateFormat = 'January 2, 2006'
  rssFeedDescription = 'summary'
  goToTop = true

[params.author]
  avatar = 'avatar.jpg'
  intro = 'Artisanal Human Content'
  name = 'DukeOfEtiquette'
  description = 'curated by a living-in-the-flesh human being'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/DukeOfEtiquette'

[[params.socialIcons]]
  name = 'Rss'
  url = '/index.xml'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[[menu.main]]
  pageRef = '/'
  name = 'Home'
  url = '/'
  weight = 10

[[menu.main]]
  pageRef = '/posts'
  name = 'Posts'
  url = '/posts/'
  weight = 20

[[menu.main]]
  pageRef = '/tags'
  name = 'Tags'
  url = '/tags/'
  weight = 30

[module]
  [[module.imports]]
    path = 'github.com/hugo-sid/hugo-blog-awesome'
