<article class="post-entry{{ if .Params.pinned }} pinned{{ end }}">
  {{ if .Params.pinned }}
  <span class="pinned-label">Pinned</span>
  {{ end }}
  <header class="entry-header">
    <h2>{{ .Title }}</h2>
  </header>
  <section class="entry-content">
    <p>{{ .Summary | plainify | truncate 120 }}</p>
  </section>
  <footer class="entry-footer">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
      {{ .Date.Format (or site.Params.DateFormat "January 2, 2006") }}
    </time>
    &nbsp;&middot;&nbsp;{{ .ReadingTime }} min
    {{ with .Params.tags }}
    <span class="entry-tags">
      {{ range . }}
      <a href="{{ "tags/" | absURL }}{{ . | urlize }}/" class="tag" onclick="event.stopPropagation();">{{ . }}</a>
      {{ end }}
    </span>
    {{ end }}
  </footer>
  <a class="entry-link" aria-label="post link to {{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</article>
