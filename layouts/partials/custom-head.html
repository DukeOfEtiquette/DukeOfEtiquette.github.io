<style>
  @media (max-width: 767px) {
    .main {
      padding-top: 1rem;
    }
  }

  @media (min-width: 768px) {
    body {
      font-size: 1.25rem;
    }
  }

  .page-header {
    padding-left: .3rem;
  }

  .menu-icon {
    padding-right: 1rem;
  }

  .logo svg {
    vertical-align: middle;
    margin-top: -.6rem;
  }

  .antenna-light {
    animation: blink 6s ease-in-out infinite;
  }

  @keyframes blink {

    0%,
    70% {
      fill-opacity: 1;
    }

    80%,
    95% {
      fill-opacity: 0;
    }

    100% {
      fill-opacity: 1;
    }
  }


  .main {
    max-width: calc(890px - (30px * 2));
    margin-left: auto;
    margin-right: auto;
    padding-left: 0.3rem;
    padding-right: 0.3rem;
  }

  .post-entry {
    position: relative;
    padding: 1.0rem .3rem;
    border-bottom: 1px solid var(--border, #e2e2e2);
  }

  .post-item .post-item-title {
    font-size: unset;
  }

  .post-item-meta {
    font-size: 1rem;
  }

  .post-entry .entry-header h2 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
  }

  .post-entry .entry-content {
    margin: 0.5rem 0;
    color: var(--secondary, #8b8b8b);
  }

  .post-entry .entry-content p {
    margin: 0;
  }

  .post-entry .entry-footer {
    color: var(--secondary, #8b8b8b);
    font-size: 0.75rem;
  }

  .post-entry .entry-link {
    position: absolute;
    inset: 0;
  }

  .post-entry:hover {
    background: color-mix(in srgb, var(--secondary, #8b8b8b) 15%, transparent);
  }

  .post-entry.pinned {
    border-left: 3px solid var(--primary, #1d7dfa);
    padding-left: 1rem;
  }

  .pinned-label {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--primary, #1d7dfa);
    margin-bottom: 0.125rem;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.querySelector('.author-name');
    if (!el) return;
    el.innerHTML = el.innerHTML.replace('Artis', '<span class="artis-hide">Artis</span>');
    var span = el.querySelector('.artis-hide');
    var bgColor = getComputedStyle(document.body).backgroundColor;

    function flicker() {
      var off = bgColor;
      var on = '';
      // rapid flickers then hold off, then flicker back on
      var steps = [
        [off, 68],  [on, 51],   // quick flicker
        [off, 85],  [on, 42],   // another flicker
        [off, 102], [on, 34],   // shorter flash
        [off, 680],             // hold dark
        [on, 0]                 // snap back on
      ];

      var i = 0;
      function next() {
        if (i >= steps.length) return;
        span.style.color = steps[i][0];
        var delay = steps[i][1];
        i++;
        setTimeout(next, delay);
      }
      next();
    }

    setTimeout(function loop() {
      flicker();
      setTimeout(loop, 66666);
    }, 66666);
  });
</script>
