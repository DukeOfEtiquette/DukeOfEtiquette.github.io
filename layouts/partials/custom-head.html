<style>
  pre>code {
    font-size: .9rem;
  }

  .dark pre {
    background: #2d333b;
  }

  .dark code {
    background: #343942;
    color: #adbac7;
  }

  .dark pre>code {
    background: transparent;
  }

  pre {
    position: relative;
  }

  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    cursor: pointer;
    background: var(--secondary-bg, #e2e2e2);
    color: var(--primary-text, #333);
    border: none;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  pre:hover .copy-btn {
    opacity: 1;
  }

  .copy-btn:hover,
  .dark .copy-btn:hover {
    background: var(--primary, #1d7dfa);
    color: #fff;
  }

  .dark .copy-btn {
    background: #444c56;
    color: #adbac7;
  }

  :not(pre)>code {
    position: relative;
  }

  :not(pre)>code:hover {
    opacity: 0.8;
  }

  :not(pre)>code.copied::after {
    content: 'Copied!';
    position: absolute;
    top: -1.75rem;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.25rem 0.5rem;
    font-size: 0.7rem;
    background: var(--primary, #1d7dfa);
    color: #fff;
    border-radius: 4px;
    white-space: nowrap;
  }

  @media (max-width: 767px) {
    .main {
      padding-top: 1rem;
    }

    .header {
      margin-top: 2.5em;
    }

    .menu {
      z-index: 100;
    }

    /* Mobile menu overlay - slightly transparent background */
    .menu input[type="checkbox"]:checked~.trigger {
      background-color: rgba(255, 255, 255, 0.85);
    }

    .dark .menu input[type="checkbox"]:checked~.trigger {
      background-color: rgba(29, 30, 32, 0.85);
    }

    .footer {
      position: relative;
      z-index: 1;
    }
  }

  @media (min-width: 768px) {
    body {
      font-size: 1.25rem;
    }

    .header {
      margin-top: 0;
    }
  }

  .page-header {
    padding-left: .3rem;
  }

  .menu-icon {
    padding-right: 1rem;
  }

  .logo svg {
    vertical-align: middle;
    margin-top: -.6rem;
  }

  .antenna-light {
    animation: easterEggBlink 6s ease-in-out infinite;
  }

  @keyframes easterEggBlink {

    0%,
    70% {
      fill-opacity: 1;
    }

    80%,
    95% {
      fill-opacity: 0;
    }

    100% {
      fill-opacity: 1;
    }
  }


  .main {
    max-width: calc(890px - (30px * 2));
    margin-left: auto;
    margin-right: auto;
    padding-left: 0.3rem;
    padding-right: 0.3rem;
  }

  .post-entry {
    position: relative;
    padding: 1.0rem .3rem;
    border-bottom: 1px solid var(--border, #e2e2e2);
  }

  .post-item .post-item-title {
    font-size: unset;
  }

  .post-item-meta {
    font-size: 1rem;
  }

  .post-entry .entry-header h2 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
  }

  .post-entry .entry-content {
    margin: 0.5rem 0;
    color: var(--secondary, #8b8b8b);
  }

  .post-entry .entry-content p {
    margin: 0;
  }

  .post-entry .entry-footer {
    color: var(--secondary, #8b8b8b);
    font-size: 0.75rem;
  }

  .post-entry .entry-link {
    position: absolute;
    inset: 0;
  }

  .post-entry:hover {
    background: color-mix(in srgb, var(--secondary, #8b8b8b) 15%, transparent);
  }

  .post-entry.pinned {
    border-left: 3px solid var(--primary, #1d7dfa);
    padding-left: 1rem;
  }

  .pinned-label {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--primary, #1d7dfa);
    margin-bottom: 0.125rem;
  }

  hr {
    border: none;
    border-top: 1px solid #000;
    margin: 1rem 0;
  }

  html.dark hr {
    border-top-color: #666;
  }

  /* Pagination */
  .pagination {
    list-style: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    padding: 2rem 0 1rem;
    margin: 0;
  }

  .pagination li a,
  .pagination li span {
    display: inline-block;
    padding: 0.5rem 0.75rem;
    text-decoration: none;
    color: var(--secondary, #8b8b8b);
    border-radius: 4px;
    transition: background 0.2s, color 0.2s;
  }

  .pagination li a:hover {
    background: color-mix(in srgb, var(--secondary, #8b8b8b) 15%, transparent);
    color: var(--primary-text, #333);
  }

  .pagination li.active a {
    background: var(--primary, #1d7dfa);
    color: #fff;
  }

  .pagination li.disabled span {
    opacity: 0.4;
    cursor: default;
  }

  .dark .pagination li a:hover {
    color: #fff;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    initCopyButtons();
    initArtisFlicker();
    initMatrixRain();
    initMobileMenuClose();
  });

  function initCopyButtons() {
    // Copy buttons for pre blocks
    document.querySelectorAll('pre').forEach(function (pre) {
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var code = pre.querySelector('code');
        var text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = 'Copy'; }, 2000);
        });
      });
      pre.appendChild(btn);
    });

    // Click to copy for inline code
    document.querySelectorAll('code').forEach(function (code) {
      if (code.parentElement.tagName === 'PRE') return;
      code.addEventListener('click', function () {
        navigator.clipboard.writeText(code.textContent).then(function () {
          code.classList.add('copied');
          setTimeout(function () { code.classList.remove('copied'); }, 1500);
        });
      });
    });
  }

  function initArtisFlicker() {
    var el = document.querySelector('.author-name');
    if (!el) return;
    el.innerHTML = el.innerHTML.replace('Artis', '<span class="artis-hide">Artis</span>');
    var span = el.querySelector('.artis-hide');
    var bgColor = getComputedStyle(document.body).backgroundColor;

    function flicker() {
      var off = bgColor;
      var on = '';
      // rapid flickers then hold off, then flicker back on
      var steps = [
        [off, 68], [on, 51],   // quick flicker
        [off, 85], [on, 42],   // another flicker
        [off, 102], [on, 34],   // shorter flash
        [off, 680],             // hold dark
        [on, 0]                 // snap back on
      ];

      var i = 0;
      function next() {
        if (i >= steps.length) return;
        span.style.color = steps[i][0];
        var delay = steps[i][1];
        i++;
        setTimeout(next, delay);
      }
      next();
    }

    setTimeout(function loop() {
      flicker();
      setTimeout(loop, 66666);
    }, 66666);
  }

  function initMatrixRain() {
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.5s';
    document.body.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var streams = [];
    var numColumns = 0;
    var fontSize = 20;
    var colWidth = 20;
    var animId = null;
    var idleTimer = null;
    var running = false;

    // Half-width katakana U+FF66–U+FF9D + digits + Latin capitals + symbols
    var chars = '';
    for (var i = 0xFF66; i <= 0xFF9D; i++) chars += String.fromCharCode(i);
    chars += '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+=-<>|:;"{}[]!@#$%^&';

    function randomChar() {
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function createStream(stagger) {
      var maxRow = Math.floor(canvas.height / fontSize);
      var length = 15 + Math.floor(Math.random() * 16); // 15–30
      var startY = stagger ? -(Math.random() * maxRow) : 0;
      // cells maps row number -> character stamped at that row
      var cells = {};
      // Pre-fill cells for rows the stream has already passed through
      var headRow = Math.floor(startY);
      for (var r = Math.max(0, headRow - length + 1); r <= headRow; r++) {
        cells[r] = randomChar();
      }
      return {
        y: startY,
        prevHeadRow: headRow,
        speed: 0.1 + Math.random() * 0.2,       // 0.1–0.3 rows/frame
        length: length,
        cells: cells,
        delay: stagger ? 0 : Math.floor(Math.random() * 61) // 0–60 frames
      };
    }

    function resetStream(s) {
      s.length = 15 + Math.floor(Math.random() * 16);
      s.cells = {};
      s.y = 0;
      s.prevHeadRow = -1;
      s.speed = 0.1 + Math.random() * 0.2;
      s.delay = Math.floor(Math.random() * 61);
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var newCols = Math.floor(canvas.width / colWidth);
      if (newCols > numColumns) {
        for (var i = numColumns; i < newCols; i++) {
          streams.push(createStream(true));
        }
      } else if (newCols < numColumns) {
        streams.length = newCols;
      }
      numColumns = newCols;
    }

    function draw() {
      // Full redraw each frame — no ghost pixels
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px monospace';
      ctx.textBaseline = 'top';

      var screenRows = Math.ceil(canvas.height / fontSize);

      for (var i = 0; i < numColumns; i++) {
        var s = streams[i];

        // Handle delay
        if (s.delay > 0) {
          s.delay--;
          continue;
        }

        var headRow = Math.floor(s.y);

        // Stamp new characters as the head advances to new rows
        for (var r = s.prevHeadRow + 1; r <= headRow; r++) {
          if (r >= 0) s.cells[r] = randomChar();
        }
        s.prevHeadRow = headRow;

        // Draw each character in the visible trail
        var tailRow = headRow - s.length + 1;
        for (var row = Math.max(0, tailRow); row <= Math.min(headRow, screenRows); row++) {
          if (!s.cells[row]) continue;

          // Distance from head: 0 = head, increases toward tail
          var dist = headRow - row;

          // Mutate: head char always changes, trail chars ~3%/frame
          if (dist === 0) {
            s.cells[row] = randomChar();
          } else if (Math.random() < 0.03) {
            s.cells[row] = randomChar();
          }

          var brightness = 1.0 - (dist / s.length);
          var x = i * colWidth;
          var py = row * fontSize;

          // Set glow and color based on distance from head
          if (dist <= 1) {
            // Head: white with strong white glow
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff';
          } else if (dist <= 3) {
            // Near head: bright green with green glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f0';
            ctx.fillStyle = '#0f0';
          } else if (brightness > 0.4) {
            // Mid trail: medium green with subtle glow
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,255,0,0.5)';
            ctx.fillStyle = 'rgba(0,255,0,' + brightness + ')';
          } else {
            // Dim trail: no glow for performance
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = 'rgba(0,255,0,' + brightness + ')';
          }

          ctx.fillText(s.cells[row], x, py);
        }

        // Turn off shadow after drawing this stream
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        // Clean up cells that have scrolled past the trail
        for (var old = tailRow - 1; old >= tailRow - 5; old--) {
          delete s.cells[old];
        }

        // Advance head
        s.y += s.speed;

        // Reset when the tail has scrolled off the bottom of the screen
        if (tailRow > screenRows) {
          resetStream(s);
        }
      }
    }

    function loop() {
      if (!running) return;
      draw();
      animId = requestAnimationFrame(loop);
    }

    function start() {
      // Re-init streams on each start for a fresh look
      streams = [];
      numColumns = 0;
      resize();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      running = true;
      canvas.style.pointerEvents = 'all';
      canvas.style.opacity = '1';
      loop();
    }

    function stop() {
      running = false;
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      canvas.style.pointerEvents = 'none';
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(start, 666666);
    }

    // Dismiss on click with fade-out
    canvas.addEventListener('click', function () {
      canvas.style.opacity = '0';
    });

    canvas.addEventListener('transitionend', function (e) {
      if (e.propertyName === 'opacity' && canvas.style.opacity === '0') {
        stop();
        resetIdleTimer();
      }
    });

    // Reset idle timer on any click
    document.addEventListener('click', function () {
      if (!running) resetIdleTimer();
    });

    window.addEventListener('resize', function () {
      if (running) resize();
    });

    // Start the initial idle timer
    resetIdleTimer();
  }

  function initMobileMenuClose() {
    var trigger = document.querySelector('.menu .trigger');
    var checkbox = document.getElementById('menu-trigger');
    if (!trigger || !checkbox) return;

    trigger.addEventListener('click', function (e) {
      // Don't close if clicking on a link, button, or the mode toggle
      if (e.target.closest('a') || e.target.closest('button') || e.target.closest('#mode')) {
        return;
      }
      checkbox.checked = false;
      // Dispatch change event so theme.js removes the blur from .wrapper
      checkbox.dispatchEvent(new Event('change'));
    });
  }
</script>
